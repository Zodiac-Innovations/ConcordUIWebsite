<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ConcordUI — cross-platform application development in Swift. Coming October 2026.">
  <title>ConcordUI — Coming October 2026</title>
  <link rel="icon" href="concordui-1024.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #101827 0%, #05070b 42%, #000 75%);
    }

    main {
      width: min(94vw, 64rem);
      padding: 2rem 1rem;
      text-align: center;
    }

    .artwork {
      display: block;
      width: min(100%, 24rem);
      height: auto;
      margin: 0 auto 1.75rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    p {
      margin: 1rem 0 0;
      color: #c8d2e3;
      font-size: clamp(1.15rem, 3vw, 1.55rem);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <img
      class="artwork"
      src="concordui-info-2026-09-08.png"
      alt="ConcordUI running native interfaces on Apple and Android from one Swift codebase"
      width="1024"
      height="1024"
    >
    <h1>ConcordUI</h1>
    <p>Coming October 2026</p>
  </main>
</body>
</html>
